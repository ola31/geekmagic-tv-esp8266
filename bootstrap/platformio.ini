; Minimal stepping-stone firmware.
;
; The stock GeekMagic image reserves a 3 MB filesystem, which leaves only about
; 520 KB of OTA staging space - too little for the full custom firmware. This
; build is small enough to go through the stock updater, and it declares a 1 MB
; filesystem, so once it is running the staging area is large enough for the
; real firmware to be uploaded over its own /update page.
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
; This panel's flash needs DOUT (see the main firmware's platformio.ini).
board_build.flash_mode = dout

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=-1
    -D TFT_DC=0
    -D TFT_RST=2
    -D TFT_BL=5
    -D TOUCH_CS=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000

monitor_speed = 115200
